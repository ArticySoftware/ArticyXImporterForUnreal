name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.platform }} / Unreal Engine ${{ matrix.ue_version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, "${{ matrix.platform }}", Unreal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, ue_version: '5.6' }
          - { platform: Windows, ue_version: '5.7' }
          - { platform: Windows, ue_version: '5.8' }
          - { platform: macOS, ue_version: '5.8' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Tests for UE ${{ matrix.ue_version }}
        if: runner.os == 'Windows'
        working-directory: Tests
        run: |
          & .\run-tests.ps1 -UeVersion ${{ matrix.ue_version }} -NoUBA
        shell: pwsh

      - name: Run Tests for UE ${{ matrix.ue_version }}
        if: runner.os == 'macOS'
        working-directory: Tests
        env:
          UE_VERSION: ${{ matrix.ue_version }}
          NO_UBA: '1'
        run: |
          ./run-tests.sh
        shell: bash

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.platform }}-ue-${{ matrix.ue_version }}-${{ github.run_id }}
          path: Tests/Report/
          retention-days: 90
